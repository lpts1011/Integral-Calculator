name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--no-sandbox --disable-gpu'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Run tests
        run: python run_tests.py
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm windows_app.spec
      - name: Test the packaged runtime
        timeout-minutes: 3
        run: |
          $app = Start-Process -FilePath 'dist/Integral_Calculator_Python/Integral_Calculator_Python.exe' -ArgumentList '--self-test','--self-test-output','runtime-check.json' -PassThru
          $runtimeHandle = $app.Handle
          if (-not $app.WaitForExit(90000)) {
            Stop-Process -Id $app.Id -Force
            throw 'Packaged runtime self-test exceeded 90 seconds'
          }
          if (Test-Path 'runtime-check.json') { Get-Content 'runtime-check.json' }
          if ($app.ExitCode -ne 0) { throw "Packaged runtime self-test failed: $($app.ExitCode)" }
          if (-not (Test-Path 'runtime-check.json')) { throw 'Runtime check report is missing' }
          $report = Get-Content 'runtime-check.json' -Raw | ConvertFrom-Json
          if (-not $report.passed) { throw 'Runtime check did not pass' }
      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path 'dist/Integral_Calculator_Python' -DestinationPath 'dist/Integral-Calculator-Python-Windows-x64-v6.1.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Integral-Calculator-Windows-v6.1
          path: |
            python/dist/Integral-Calculator-Python-Windows-x64-v6.1.zip
            python/runtime-check.json
